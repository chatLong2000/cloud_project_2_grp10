<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 330" width="100%" height="100%" style="background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DD6B20" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#9333EA" />
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- ==================== LOCAL ENVIRONMENT ==================== -->
  <rect x="12" y="12" width="215" height="306" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="24" y="30" font-size="10.5" font-weight="bold" fill="#334155" letter-spacing="0.5">LOCAL ENVIRONMENT (Docker)</text>

  <!-- 50 Coffee Machines -->
  <g filter="url(#card-shadow)">
    <rect x="22" y="42" width="195" height="66" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="119" y="62" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">50 Coffee Machines</text>
    <text x="119" y="78" font-size="8.5" fill="#475569" text-anchor="middle">Simulated ESP32 firmware</text>
    <text x="119" y="93" font-size="8" fill="#64748B" text-anchor="middle">CSV Telemetry (1 frame / 2s)</text>
  </g>

  <!-- Dev -> Edge Arrow -->
  <path d="M 119 108 L 119 135" fill="none" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow-gray)" />
  <rect x="92" y="114" width="55" height="15" rx="3" fill="#F1F5F9" />
  <text x="119" y="125" font-size="7.5" font-weight="bold" fill="#475569" text-anchor="middle">UART / pty</text>

  <!-- Edge Gateway -->
  <g filter="url(#card-shadow)">
    <rect x="22" y="137" width="195" height="108" rx="6" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" />
    <text x="119" y="156" font-size="11" font-weight="bold" fill="#0F172A" text-anchor="middle">Edge Gateway (Docker)</text>
    <text x="32" y="174" font-size="8" fill="#334155">• Multi-thread UART serial readers</text>
    <text x="32" y="188" font-size="8" fill="#334155">• CSV validation &amp; line filtering</text>
    <text x="32" y="202" font-size="8" fill="#334155">• Local SQLite Buffer (WAL mode)</text>
    <text x="32" y="216" font-size="8" fill="#334155">• Store &amp; forward (PUBACK tracking)</text>
    <text x="32" y="230" font-size="8" font-weight="bold" fill="#C2410C">• MQTT/TLS batches (&#8804; 60s)</text>
  </g>

  <rect x="30" y="260" width="178" height="44" rx="4" fill="#E2E8F0" />
  <text x="119" y="276" font-size="8" font-weight="bold" fill="#334155" text-anchor="middle">Client Constraint Respected</text>
  <text x="119" y="291" font-size="7.5" fill="#475569" text-anchor="middle">No AWS Greengrass, zero Cloud cost</text>

  <!-- ==================== AWS CLOUD ==================== -->
  <rect x="240" y="12" width="545" height="306" rx="8" fill="#FFFDF9" stroke="#EA580C" stroke-width="1.5" />
  <text x="252" y="30" font-size="10.5" font-weight="bold" fill="#C2410C" letter-spacing="0.5">AWS CLOUD (Region: us-east-1)</text>

  <!-- Edge to AWS Connection Line -->
  <path d="M 217 190 L 255 190 L 255 78 L 268 78" fill="none" stroke="#EA580C" stroke-width="1.5" marker-end="url(#arrow-orange)" />
  <rect x="223" y="120" width="64" height="28" rx="4" fill="#FFEDD5" stroke="#FDBA74" stroke-width="0.8" />
  <text x="255" y="132" font-size="7" font-weight="bold" fill="#9A3412" text-anchor="middle">MQTT/TLS 8883</text>
  <text x="255" y="142" font-size="6.5" fill="#9A3412" text-anchor="middle">X.509 certs, QoS 1</text>

  <!-- AWS IoT Core -->
  <g filter="url(#card-shadow)">
    <rect x="270" y="46" width="105" height="66" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.2" />
    <text x="322" y="66" font-size="9.5" font-weight="bold" fill="#9A3412" text-anchor="middle">AWS IoT Core</text>
    <text x="322" y="80" font-size="7.5" fill="#475569" text-anchor="middle">Managed Broker (PaaS)</text>
    <text x="322" y="94" font-size="7" fill="#7C2D12" text-anchor="middle">Topic Rule Router</text>
    <text x="322" y="104" font-size="6.5" fill="#64748B" text-anchor="middle">coffee-GRP10/+/batch</text>
  </g>

  <!-- IoT Core -> Lambda Arrow -->
  <path d="M 375 78 L 405 78" fill="none" stroke="#EA580C" stroke-width="1.4" marker-end="url(#arrow-orange)" />

  <!-- AWS Lambda Ingestor -->
  <g filter="url(#card-shadow)">
    <rect x="407" y="46" width="110" height="66" rx="6" fill="#FFFFFF" stroke="#F97316" stroke-width="1.2" />
    <text x="462" y="66" font-size="9.5" font-weight="bold" fill="#9A3412" text-anchor="middle">Lambda Ingestor</text>
    <text x="462" y="80" font-size="7.5" fill="#475569" text-anchor="middle">Serverless FaaS (Py 3.12)</text>
    <text x="462" y="94" font-size="7" fill="#7C2D12" text-anchor="middle">Stateless batch unloader</text>
    <text x="462" y="104" font-size="6.5" fill="#64748B" text-anchor="middle">Max 100 rec / call</text>
  </g>

  <!-- Lambda -> Timestream Arrow -->
  <path d="M 517 78 L 547 78" fill="none" stroke="#16A34A" stroke-width="1.4" marker-end="url(#arrow-green)" />
  <text x="532" y="72" font-size="6.5" font-weight="bold" fill="#15803D" text-anchor="middle">Write</text>

  <!-- Amazon Timestream -->
  <g filter="url(#card-shadow)">
    <rect x="549" y="42" width="138" height="74" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.4" />
    <text x="618" y="61" font-size="10" font-weight="bold" fill="#14532D" text-anchor="middle">Amazon Timestream</text>
    <text x="618" y="74" font-size="7.5" fill="#166534" text-anchor="middle">Time-Series Database (PaaS)</text>
    <text x="618" y="88" font-size="7" fill="#15803D" text-anchor="middle">• Memory Store (24h)</text>
    <text x="618" y="99" font-size="7" fill="#15803D" text-anchor="middle">• Magnetic Store (90d / 3 mo)</text>
    <text x="618" y="110" font-size="7" font-weight="bold" fill="#14532D" text-anchor="middle">Multi-Measure Records</text>
  </g>

  <!-- Timestream -> EC2 Stack Query Line -->
  <path d="M 618 116 L 618 145 L 535 145 L 535 158" fill="none" stroke="#2563EB" stroke-width="1.4" marker-end="url(#arrow-blue)" />
  <rect x="560" y="137" width="65" height="14" rx="3" fill="#EFF6FF" />
  <text x="592" y="147" font-size="6.5" font-weight="bold" fill="#1E40AF" text-anchor="middle">SQL Queries</text>

  <!-- ==================== EC2 VM CONTAINER STACK ==================== -->
  <rect x="270" y="160" width="355" height="145" rx="6" fill="#F0F9FF" stroke="#0284C7" stroke-width="1.3" />
  <text x="282" y="176" font-size="9" font-weight="bold" fill="#0369A1">EC2 Monitoring VM : t3.small (IaaS - Docker Compose Stack)</text>

  <!-- Scenario Analyzer -->
  <g filter="url(#card-shadow)">
    <rect x="280" y="184" width="160" height="110" rx="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.1" />
    <text x="360" y="201" font-size="9.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Scenario Analyzer</text>
    <text x="360" y="214" font-size="7.5" fill="#0369A1" text-anchor="middle">Python Worker &amp; REST API (:8000)</text>
    <text x="288" y="230" font-size="7" fill="#334155">• Sliding-window SQL on Timestream</text>
    <text x="288" y="242" font-size="7" fill="#334155">• Thermal runaway, Mem leak, OOM</text>
    <text x="288" y="254" font-size="7" font-weight="bold" fill="#B91C1C">• Silent Device Watchdog (&gt; 5 min)</text>
    <text x="288" y="266" font-size="7" fill="#15803D">• Writes events to Timestream alerts</text>
    <text x="288" y="278" font-size="7" fill="#B91C1C">• Dispatches SNS on critical alerts</text>
  </g>

  <!-- Analyzer -> Grafana Arrow -->
  <path d="M 440 236 L 468 236" fill="none" stroke="#0284C7" stroke-width="1.3" marker-end="url(#arrow-blue)" />
  <text x="454" y="231" font-size="6.5" font-weight="bold" fill="#0369A1" text-anchor="middle">REST</text>

  <!-- Grafana OSS -->
  <g filter="url(#card-shadow)">
    <rect x="470" y="184" width="145" height="110" rx="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.1" />
    <text x="542" y="201" font-size="9.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Grafana OSS 13.0</text>
    <text x="542" y="214" font-size="7.5" fill="#0369A1" text-anchor="middle">Infinity Plugin Connector</text>
    <text x="478" y="230" font-size="7" fill="#334155">• 5-minute Realtime Overview</text>
    <text x="478" y="242" font-size="7" fill="#334155">• Fleet health &amp; active statuses</text>
    <text x="478" y="254" font-size="7" fill="#334155">• Per-machine metric drill-down</text>
    <text x="478" y="266" font-size="7" fill="#334155">• Alerts history dashboard</text>
    <text x="478" y="278" font-size="7" font-weight="bold" fill="#0369A1">• Published on port 3000</text>
  </g>

  <!-- Amazon SNS -->
  <g filter="url(#card-shadow)">
    <rect x="645" y="215" width="130" height="55" rx="5" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.2" />
    <text x="710" y="232" font-size="9" font-weight="bold" fill="#881337" text-anchor="middle">Amazon SNS (PaaS)</text>
    <text x="710" y="245" font-size="7" fill="#9F1239" text-anchor="middle">GRP10-SdatawayAlertsTopic</text>
    <text x="710" y="257" font-size="7" fill="#BE123C" text-anchor="middle">Instant Email &amp; SMS</text>
  </g>

  <!-- Analyzer -> SNS Arrow (routed cleanly below Grafana) -->
  <path d="M 440 286 L 460 286 L 460 300 L 635 300 L 635 250 L 643 250" fill="none" stroke="#E11D48" stroke-width="1.3" marker-end="url(#arrow-red)" />
  <rect x="500" y="293" width="60" height="13" rx="3" fill="#FFE4E6" />
  <text x="530" y="302" font-size="6.5" font-weight="bold" fill="#9F1239" text-anchor="middle">SNS Publish</text>

  <!-- CloudWatch Logs -->
  <g filter="url(#card-shadow)">
    <rect x="695" y="46" width="82" height="70" rx="5" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.2" />
    <text x="736" y="65" font-size="8.5" font-weight="bold" fill="#581C87" text-anchor="middle">CloudWatch</text>
    <text x="736" y="78" font-size="7" fill="#7E22CE" text-anchor="middle">Logs (PaaS)</text>
    <text x="736" y="92" font-size="6.5" fill="#6B21A8" text-anchor="middle">Retention: 1y</text>
    <text x="736" y="104" font-size="6.5" fill="#6B21A8" text-anchor="middle">(IoT, Lbd, VM)</text>
  </g>

  <!-- ==================== OPERATOR / CLIENT ==================== -->
  <g filter="url(#card-shadow)">
    <rect x="800" y="120" width="138" height="155" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    <text x="869" y="145" font-size="11" font-weight="bold" fill="#F8FAFC" text-anchor="middle">Operator / User</text>
    <text x="869" y="160" font-size="8" fill="#94A3B8" text-anchor="middle">(SDATAWAY &amp; Staff)</text>

    <rect x="810" y="174" width="118" height="38" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" />
    <text x="869" y="190" font-size="7.5" font-weight="bold" fill="#38BDF8" text-anchor="middle">Grafana Dashboard</text>
    <text x="869" y="202" font-size="7" fill="#94A3B8" text-anchor="middle">HTTP :3000 (Fleet Status)</text>

    <rect x="810" y="222" width="118" height="38" rx="4" fill="#1E293B" stroke="#F87171" stroke-width="0.8" />
    <text x="869" y="238" font-size="7.5" font-weight="bold" fill="#F87171" text-anchor="middle">Critical Alert Delivery</text>
    <text x="869" y="250" font-size="7" fill="#94A3B8" text-anchor="middle">Email / SMS Notifications</text>
  </g>

  <!-- Grafana -> User Arrow -->
  <path d="M 615 192 L 798 192" fill="none" stroke="#0284C7" stroke-width="1.4" marker-end="url(#arrow-blue)" />

  <!-- SNS -> User Arrow -->
  <path d="M 775 242 L 798 242" fill="none" stroke="#E11D48" stroke-width="1.4" marker-end="url(#arrow-red)" />

</svg>