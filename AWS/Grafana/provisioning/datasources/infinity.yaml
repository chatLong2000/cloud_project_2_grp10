# Scenario Analyzer JSON API, read through the Infinity plugin (doc/adr/0001-grafana-datasource.md).
apiVersion: 1

datasources:
  - name: Analyser
    uid: analyser-api
    type: yesoreyeram-infinity-datasource
    access: proxy
    isDefault: true
    editable: false
    jsonData:
      allowedHosts:
        - http://analyser:8000
