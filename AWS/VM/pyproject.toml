[project]
name = "vm-setup"
version = "0.1.0"
description = "Mise en place de la VM EC2 Monitoring & Analytics (Scenario Analyzer + Grafana) depuis un notebook"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "jupyterlab>=4.2",
]

[dependency-groups]
dev = [
    "moto[ec2,iam,s3,ssm]>=5.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vm_setup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # macOS/iCloud can hide the editable .pth
addopts = "-q"

[tool.coverage.run]
source = ["vm_setup"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 120
