[project]
name = "analyser"
version = "0.1.0"
description = "Scenario Analyzer : détection des scénarios de panne des machines à café et API JSON pour Grafana"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn>=0.30",
]

[project.scripts]
analyser = "analyser.__main__:main"

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
]
notebooks = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# macOS can flag .venv files as hidden, and Python then skips the editable .pth.
pythonpath = ["src"]
markers = ["integration: drives the real simulator or the full pipeline"]
addopts = "-q"

[tool.coverage.run]
source = ["analyser"]
omit = ["*/analyser/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
